[project]
name = "kron-fm"
version = "0.1.0"
description = "A family of KronLSTM foundation models: krontime (time series) and kron-dna (coding DNA)"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "einops>=0.8",
    "numpy>=2.0",
    "packaging>=24",
    "torch>=2.9.1",
    "typer>=0.15.0",
]

[project.scripts]
kron-dna = "kron_dna.cli:app"

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kron_core", "src/krontime", "src/kron_dna"]

[tool.uv]
system-certs = true

# The same CUDA 12.8 wheels as glucose_forecasting_metabonet, so the two projects share one torch build.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
