[project]
name = "kron-fm"
version = "0.1.0"
description = "A family of KronLSTM foundation models: krontime (time series) and kron-dna (coding DNA)"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "einops>=0.8",
    "h5py>=3.11",
    "numpy>=2.0",
    "packaging>=24",
    "pandas>=2.2",
    "polars>=1.30",
    "scikit-learn>=1.6",
    "scipy>=1.14",
    "torch>=2.9.1",
    "typer>=0.15.0",
    "wfdb>=4.1",
]

[project.scripts]
kron-data = "kron_core.data_cli:app"
kron-dna = "kron_dna.cli:app"
kron-ppg = "kron_ppg.cli:app"
kron-health = "kron_health.cli:app"

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kron_core", "src/krontime", "src/kron_dna", "src/kron_ppg", "src/kron_health"]

[tool.uv]
system-certs = true
# `uv sync` installs these too, so naming no group never uninstalls the ONNX tools or pytest.
default-groups = ["dev", "onnx"]

# The same CUDA 12.8 wheels as glucose_forecasting_metabonet, so the two projects share one torch build.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
baselines = [
    "alphagenome>=2.0.0",
    "fair-esm>=2.0.0",
]
dev = [
    "pytest>=8.3",
]
genomics = [
    "polars-bio>=0.37.0",
]
# ONNX export and its checks (krontime.onnx_export, kron_dna.onnx_export), the same pins as the glucose repo.
onnx = [
    "onnx>=1.17,<2",
    "onnxruntime>=1.20,<2",
    "onnxscript>=0.3,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
