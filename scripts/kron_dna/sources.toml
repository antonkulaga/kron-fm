# The genomes kron-fm prepares from NCBI assemblies, one table per genome: what `prep.py source genome NAME` reads.
# No machine or cluster name belongs here: where data lives is $KRON_FM_DATA, how jobs are submitted is slurm/env.sh.
#
#   accession   the assembly's folder name on NCBI's genomes FTP (GCF_... RefSeq, GCA_... GenBank)
#   annotation  true: the assembly's own GTF gives the gene-structure labels (tracks/NAME/gene-structure-refseq)
#   min_seq     sequences shorter than this are left out
#   held        the held-out chromosomes, '+'-joined, as each genome was prepared (first chosen by "auto": one or two
#               chromosomes nearest 9 % of the bases; written out here because that rule has changed once already);
#               "auto" for a new entry, then replace it by what was picked; "": none (a benchmark genome)
#   orthologs   true: also hold out the genes orthologous to human chr8/chr9 (tracks/NAME/split-orthologs-v1)
#   role        train | benchmark (never trained on: an unseen-genome or answer-key test)
#   verified    true: `prep.py source verify NAME` rebuilt the entry and found the prepared genome, contig table,
#               gene labels and split identical (the 13 prepared by hand before the manifest: 24 Nov 2026, after
#               their min_seq and held-out names were corrected here; D. simulans and D. yakuba likewise), or the
#               genome was prepared that day by the same steps with these settings

